name: Spotilike Java Services CI/CD

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - 'backend/gateway-go/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - 'backend/gateway-go/**'

jobs:
  shared-libs:
    name: Build & Test Shared Libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build & Test shared-exception
        run: |
          cd backend
          ./gradlew :shared-libs:shared-exception:build --no-daemon

      - name: Build & Test shared-security
        run: |
          cd backend
          ./gradlew :shared-libs:shared-security:build --no-daemon

  microservices:
    name: Build & Test ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: shared-libs

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: 'user-service'
            gradle-path: ':user-service'
          - name: 'gateway-service'
            gradle-path: ':gateway-service'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Build and Test ${{ matrix.service.name }}
        run: |
          cd backend
          ./gradlew ${{ matrix.service.gradle-path }}:build --no-daemon

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: microservices
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service: [ user-service, gateway-service ]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
